<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#102418" />
<title>Mon Jardin - Pilotage 3D</title>
<style>
  :root {
    --bg: #0c1d13;
    --card: rgba(14, 34, 21, 0.90);
    --card-border: rgba(102, 184, 122, 0.25);
    --text: #f3f9f4;
    --muted: #98b8a2;
    --green: #22c55e;
    --lime: #84cc16;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --red: #ef4444;
    --btn-green: #109b58;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
  }
  #scene-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .hud-top {
    position: fixed;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }
  .hud-top > * { pointer-events: auto; }

  .summary-card {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 14px 16px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
  }
  .summary-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .app-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: rgba(34, 197, 94, 0.16);
    border: 1px solid rgba(74, 222, 128, 0.35);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 3px;
    padding: 9px;
    flex-shrink: 0;
  }
  .app-icon span {
    border-radius: 3px;
    border: 1.8px solid #6ee79a;
  }
  .summary-title {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat-box {
    background: rgba(8, 22, 14, 0.72);
    border: 1px solid rgba(134, 239, 172, 0.12);
    border-radius: 14px;
    padding: 8px 6px;
    text-align: center;
  }
  .stat-label {
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .stat-val {
    font-size: 1.02rem;
    font-weight: 800;
    margin-top: 2px;
    color: #ffffff;
  }
  .stat-val.accent { color: #fde047; }

  .action-row {
    display: grid;
    grid-template-columns: 1fr 1.45fr;
    gap: 10px;
  }
  .action-btn {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  }
  .action-btn.sync {
    background: linear-gradient(180deg, #14a860, #0d894d);
    border-color: rgba(110, 231, 183, 0.45);
  }
  .action-btn:active { transform: scale(0.98); }

  .hud-bottom {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: 10px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .hud-bottom > * { pointer-events: auto; }

  .legend-bar {
    align-self: flex-start;
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.78rem;
    font-weight: 600;
    overflow-x: auto;
    max-width: 100%;
    scrollbar-width: none;
  }
  .legend-bar::-webkit-scrollbar { display: none; }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }

  .bed-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 0;
    scrollbar-width: none;
    touch-action: pan-x;
  }
  .bed-strip::-webkit-scrollbar { display: none; }
  .bed-pill {
    flex: 0 0 auto;
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 8px 14px;
    color: var(--text);
    font-size: 0.84rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
  }
  .bed-pill.active {
    background: rgba(22, 163, 74, 0.35);
    border-color: #4ade80;
  }

  .drawer {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: 96px;
    max-height: 62vh;
    overflow-y: auto;
    z-index: 30;
    background: rgba(13, 30, 19, 0.96);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(110, 231, 183, 0.38);
    border-radius: 20px;
    padding: 14px 16px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    display: none;
    touch-action: pan-y;
  }
  .drawer.open { display: block; }
  .drawer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .drawer-top h3 { margin: 0; font-size: 1.05rem; }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .field { margin-bottom: 8px; }
  .field label {
    display: block;
    font-size: 0.74rem;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: rgba(7, 17, 11, 0.9);
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .field textarea { min-height: 54px; resize: vertical; }
  .drawer-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .btn-sm {
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-sm.save {
    flex: 1;
    background: #109b58;
    border-color: #6ee7b7;
  }

  .modal-bg {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0, 0, 0, 0.68);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }
  .modal-bg.open { display: flex; }
  .modal-card {
    width: min(540px, 100%);
    max-height: 82vh;
    overflow-y: auto;
    background: #0f2417;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 16px;
  }
  .modal-card pre {
    background: #07120b;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 10px;
    font-size: 0.72rem;
    color: #d1fae5;
    overflow-x: auto;
    white-space: pre-wrap;
  }

  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;
    background: rgba(16, 40, 25, 0.95);
    border: 1px solid #4ade80;
    color: #ffffff;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <div class="hud-top">
    <div class="summary-card">
      <div class="summary-header">
        <div class="app-icon" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <h1 class="summary-title">Mon Jardin - Pilotage 3D</h1>
      </div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">CARRÉS</div>
          <div class="stat-val" id="stat-count">12</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">SURFACE</div>
          <div class="stat-val" id="stat-surface">77,00 m²</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">VOLUME TERRE</div>
          <div class="stat-val accent" id="stat-volume">25,85 m³</div>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button class="action-btn" id="btn-reset-view">↺ Réinitialiser vue</button>
      <button class="action-btn sync" id="btn-sync">⧉ Sync Sheets (CSV / JSON)</button>
    </div>
  </div>

  <aside class="drawer" id="drawer">
    <div class="drawer-top">
      <h3 id="ed-title">Carré A</h3>
      <button class="btn-sm" id="btn-close-ed">✕</button>
    </div>
    <div class="grid-2">
      <div class="field">
        <label for="ed-statut">Statut</label>
        <select id="ed-statut">
          <option value="Libre">Libre</option>
          <option value="En culture">En culture</option>
          <option value="À arroser">À arroser</option>
          <option value="Récolte">Récolte</option>
          <option value="À préparer">À préparer</option>
        </select>
      </div>
      <div class="field">
        <label for="ed-protection">Protection</label>
        <select id="ed-protection">
          <option value="Plein air (haut)">Plein air (haut)</option>
          <option value="Plein air (bas)">Plein air (bas)</option>
          <option value="Sous filet anti-insectes">Sous filet anti-insectes</option>
          <option value="Sous serre">Sous serre</option>
          <option value="Grand carré plein air (bas)">Grand carré plein air (bas)</option>
          <option value="Grand carré plein air">Grand carré plein air</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="ed-cultures">Cultures en cours</label>
      <input id="ed-cultures" type="text" placeholder="Ex. Tomates cerises, Radis" />
    </div>
    <div class="grid-2">
      <div class="field">
        <label for="ed-longueur">Longueur (m)</label>
        <input id="ed-longueur" type="number" step="0.1" min="0.5" max="15" />
      </div>
      <div class="field">
        <label for="ed-largeur">Largeur (m)</label>
        <input id="ed-largeur" type="number" step="0.1" min="0.5" max="15" />
      </div>
    </div>
    <div class="grid-2">
      <div class="field">
        <label for="ed-hauteur">Hauteur terre/bordure (m)</label>
        <input id="ed-hauteur" type="number" step="0.05" min="0.05" max="2.5" />
      </div>
      <div class="field">
        <label for="ed-date">Dernière action</label>
        <input id="ed-date" type="date" />
      </div>
    </div>
    <div class="field">
      <label for="ed-notes">Notes</label>
      <textarea id="ed-notes" placeholder="Arrosage, paillage, récolte..."></textarea>
    </div>
    <div class="drawer-actions">
      <button class="btn-sm save" id="btn-save-ed">Enregistrer</button>
      <button class="btn-sm" id="btn-reset-ed">Réinitialiser</button>
    </div>
  </aside>

  <div class="hud-bottom">
    <div class="legend-bar">
      <span class="legend-item"><span class="dot" style="background:#22c55e;"></span>Libre</span>
      <span class="legend-item"><span class="dot" style="background:#84cc16;"></span>En culture</span>
      <span class="legend-item"><span class="dot" style="background:#3b82f6;"></span>À arroser</span>
    </div>
    <div class="bed-strip" id="bed-strip"></div>
  </div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal-card" id="modal-card"></div>
  </div>

  <input type="file" id="import-file" accept=".csv,.json,text/csv,application/json" style="display:none;" />
  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'mon_jardin_pilotage_3d_v5';

    const INITIAL_BEDS = [
      { id: 'P-01', nom: 'Carré A', protection: 'Plein air (haut)', longueur: 4.00, largeur: 1.00, hauteur: 0.60, statut: 'Libre', cultures: '', date: '2026-11-19', notes: '', x: -7.2, z: 4.4 },
      { id: 'P-02', nom: 'Carré B', protection: 'Plein air (haut)', longueur: 4.00, largeur: 1.00, hauteur: 0.60, statut: 'À arroser', cultures: '', date: '2026-11-12', notes: '', x: -2.4, z: 4.4 },
      { id: 'P-03', nom: 'Carré C', protection: 'Plein air (haut)', longueur: 4.00, largeur: 1.00, hauteur: 0.60, statut: 'Libre', cultures: '', date: '2026-11-10', notes: '', x: 2.4, z: 4.4 },
      { id: 'P-04', nom: 'Carré D', protection: 'Plein air (haut)', longueur: 4.00, largeur: 1.00, hauteur: 0.60, statut: 'Libre', cultures: '', date: '2026-11-18', notes: '', x: 7.2, z: 4.4 },
      { id: 'P-05', nom: 'Carré E', protection: 'Plein air (haut)', longueur: 6.00, largeur: 1.00, hauteur: 0.60, statut: 'Libre', cultures: '', date: '2026-11-17', notes: '', x: -6.2, z: 1.4 },
      { id: 'P-06', nom: 'Carré F', protection: 'Sous filet anti-insectes', longueur: 8.00, largeur: 1.00, hauteur: 0.40, statut: 'Libre', cultures: '', date: '2026-11-20', notes: '', x: 2.6, z: 1.4 },
      { id: 'P-07', nom: 'Carré G', protection: 'Sous serre', longueur: 4.00, largeur: 1.00, hauteur: 0.15, statut: 'Libre', cultures: '', date: '2026-11-13', notes: '', x: -7.6, z: -1.8 },
      { id: 'P-08', nom: 'Carré H', protection: 'Plein air (bas)', longueur: 3.00, largeur: 1.00, hauteur: 0.15, statut: 'En culture', cultures: '', date: '2026-11-08', notes: '', x: -4.2, z: -1.8 },
      { id: 'P-09', nom: 'Carré I', protection: 'Plein air (bas)', longueur: 3.00, largeur: 1.00, hauteur: 0.15, statut: 'En culture', cultures: '', date: '2026-11-16', notes: '', x: -0.6, z: -1.8 },
      { id: 'P-10', nom: 'Carré J', protection: 'Plein air (bas)', longueur: 3.00, largeur: 1.00, hauteur: 0.15, statut: 'En culture', cultures: '', date: '2026-11-14', notes: '', x: 3.0, z: -1.8 },
      { id: 'P-11', nom: 'Carré K', protection: 'Grand carré plein air (bas)', longueur: 6.00, largeur: 3.00, hauteur: 0.15, statut: 'En culture', cultures: '', date: '2026-11-15', notes: '', x: 7.4, z: -2.4 },
      { id: 'P-12', nom: 'Carré L', protection: 'Grand carré plein air', longueur: 4.00, largeur: 4.00, hauteur: 0.30, statut: 'En culture', cultures: '', date: '2026-11-11', notes: '', x: 2.6, z: -5.6 }
    ];

    const STATUS_COLORS = {
      'Libre': '#22c55e',
      'En culture': '#84cc16',
      'À arroser': '#3b82f6',
      'Récolte': '#f59e0b',
      'À préparer': '#ef4444'
    };

    function cloneInitial() {
      return JSON.parse(JSON.stringify(INITIAL_BEDS));
    }

    function loadBeds() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return cloneInitial();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || parsed.length !== 12) return cloneInitial();
        return parsed;
      } catch {
        return cloneInitial();
      }
    }

    function saveBeds() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(beds));
      } catch {}
    }

    let beds = loadBeds();
    let selectedId = beds[0].id;

    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    function updateSummary() {
      let surf = 0;
      let vol = 0;
      for (const b of beds) {
        const l = Number(b.longueur) || 0;
        const w = Number(b.largeur) || 0;
        const h = Number(b.hauteur) || 0;
        const s = l * w;
        surf += s;
        vol += s * h;
      }
      document.getElementById('stat-count').textContent = String(beds.length);
      document.getElementById('stat-surface').textContent = surf.toFixed(2).replace('.', ',') + ' m²';
      document.getElementById('stat-volume').textContent = vol.toFixed(2).replace('.', ',') + ' m³';
    }

    const canvas = document.getElementById('scene-canvas');
    const ctx = canvas.getContext('2d');

    const DEFAULT_VIEW = {
      yaw: -0.68,
      pitch: 0.62,
      zoom: 24,
      panX: 0,
      panY: 42
    };
    let view = { ...DEFAULT_VIEW };
    let hitPolys = [];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      render();
    }

    function project(wx, wy, wz) {
      const cx = window.innerWidth * 0.5 + view.panX;
      const cy = window.innerHeight * 0.54 + view.panY;
      const cosY = Math.cos(view.yaw);
      const sinY = Math.sin(view.yaw);
      const rx = wx * cosY - wz * sinY;
      const rz = wx * sinY + wz * cosY;

      const cosP = Math.cos(view.pitch);
      const sinP = Math.sin(view.pitch);
      return {
        x: cx + rx * view.zoom,
        y: cy + (rz * cosP - wy * sinP) * view.zoom
      };
    }

    function shade(hex, factor) {
      const n = parseInt(hex.replace('#', ''), 16);
      const r = Math.min(255, Math.max(0, Math.round(((n >> 16) & 255) * factor)));
      const g = Math.min(255, Math.max(0, Math.round(((n >> 8) & 255) * factor)));
      const b = Math.min(255, Math.max(0, Math.round((n & 255) * factor)));
      return `rgb(${r},${g},${b})`;
    }

    function fillPoly(pts, fill, stroke, lw = 1.2) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
    }

    function drawBox(x, y, z, w, h, d, color, selected) {
      const x0 = x - w / 2, x1 = x + w / 2;
      const y0 = y, y1 = y + h;
      const z0 = z - d / 2, z1 = z + d / 2;

      const p001 = project(x0, y0, z1);
      const p101 = project(x1, y0, z1);
      const p100 = project(x1, y0, z0);
      const p000 = project(x0, y0, z0);

      const p010 = project(x0, y1, z0);
      const p110 = project(x1, y1, z0);
      const p111 = project(x1, y1, z1);
      const p011 = project(x0, y1, z1);

      const stroke = selected ? '#ffffff' : 'rgba(9, 22, 14, 0.5)';
      const lw = selected ? 2.4 : 1.0;

      if (h > 0.01) {
        fillPoly([p001, p101, p111, p011], shade(color, 0.72), stroke, lw);
        fillPoly([p101, p100, p110, p111], shade(color, 0.56), stroke, lw);
        fillPoly([p000, p001, p011, p010], shade(color, 0.64), stroke, lw);
      }
      const top = [p010, p110, p111, p011];
      fillPoly(top, shade(color, selected ? 1.12 : 1.0), stroke, lw);
      return top;
    }

    function drawCrops(bed, soilY, L, W) {
      const cols = Math.max(2, Math.min(7, Math.round(L * 1.1)));
      const rows = Math.max(1, Math.min(4, Math.round(W * 1.1)));
      const stepX = (L * 0.72) / Math.max(1, cols);
      const stepZ = (W * 0.72) / Math.max(1, rows);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const px = bed.x - (L * 0.36) + (c + 0.5) * stepX;
          const pz = bed.z - (W * 0.36) + (r + 0.5) * stepZ;
          const pt = project(px, soilY + 0.14, pz);
          const rad = Math.max(3.5, Math.min(8, view.zoom * 0.22));
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, rad, 0, Math.PI * 2);
          ctx.fillStyle = '#65d654';
          ctx.fill();
          ctx.strokeStyle = 'rgba(20, 65, 22, 0.7)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    function drawProtection(bed, H, L, W) {
      const p = (bed.protection || '').toLowerCase();
      if (p.includes('serre')) {
        const gh = 1.35;
        const x0 = bed.x - L * 0.48, x1 = bed.x + L * 0.48;
        const z0 = bed.z - W * 0.48, z1 = bed.z + W * 0.48;
        const y0 = H, y1 = H + gh;

        const b00 = project(x0, y0, z0), b10 = project(x1, y0, z0);
        const b11 = project(x1, y0, z1), b01 = project(x0, y0, z1);
        const t00 = project(x0, y1, z0), t10 = project(x1, y1, z0);
        const t11 = project(x1, y1, z1), t01 = project(x0, y1, z1);

        fillPoly([b01, b11, t11, t01], 'rgba(186, 230, 253, 0.16)', 'rgba(224, 242, 254, 0.75)', 1.3);
        fillPoly([t00, t10, t11, t01], 'rgba(224, 242, 254, 0.24)', 'rgba(224, 242, 254, 0.85)', 1.4);
        ctx.strokeStyle = 'rgba(224, 242, 254, 0.7)';
        ctx.lineWidth = 1.2;
        for (const [a, b] of [[b00, t00], [b10, t10], [b11, t11], [b01, t01]]) {
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      } else if (p.includes('filet')) {
        const nh = 0.75;
        const x0 = bed.x - L * 0.48, x1 = bed.x + L * 0.48;
        const z0 = bed.z - W * 0.48, z1 = bed.z + W * 0.48;
        const y0 = H, y1 = H + nh;

        const t00 = project(x0, y1, z0), t10 = project(x1, y1, z0);
        const t11 = project(x1, y1, z1), t01 = project(x0, y1, z1);
        fillPoly([t00, t10, t11, t01], 'rgba(241, 245, 249, 0.08)', 'rgba(226, 232, 240, 0.75)', 1.2);

        ctx.strokeStyle = 'rgba(226, 232, 240, 0.35)';
        ctx.lineWidth = 0.9;
        const steps = 6;
        for (let i = 1; i < steps; i++) {
          const frac = i / steps;
          const a = project(x0 + (x1 - x0) * frac, y1, z0);
          const b = project(x0 + (x1 - x0) * frac, y1, z1);
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }

    function render() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#173b22');
      bgGrad.addColorStop(1, '#102917');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      const pathPts = [
        project(-11, 0.01, -0.2),
        project(11, 0.01, -0.2),
        project(11, 0.01, 2.8),
        project(-11, 0.01, 2.8)
      ];
      fillPoly(pathPts, 'rgba(130, 148, 158, 0.42)', 'rgba(180, 198, 208, 0.25)', 1);

      ctx.strokeStyle = 'rgba(134, 239, 172, 0.08)';
      ctx.lineWidth = 1;
      for (let g = -10; g <= 10; g += 2) {
        const a = project(g, 0, -8);
        const b = project(g, 0, 7);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

        const c = project(-10, 0, g);
        const d = project(10, 0, g);
        ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
      }

      hitPolys = [];
      const sorted = [...beds].sort((a, b) => {
        const da = Math.sin(view.yaw) * a.x + Math.cos(view.yaw) * a.z;
        const db = Math.sin(view.yaw) * b.x + Math.cos(view.yaw) * b.z;
        return da - db;
      });

      for (const bed of sorted) {
        const L = Math.max(0.5, Number(bed.longueur) || 1);
        const W = Math.max(0.5, Number(bed.largeur) || 1);
        const H = Math.max(0.18, (Number(bed.hauteur) || 0.2) * 1.45);
        const col = STATUS_COLORS[bed.statut] || '#22c55e';
        const isSel = bed.id === selectedId;

        const topPoly = drawBox(bed.x, 0, bed.z, L, H, W, '#9a5b28', isSel);
        drawBox(bed.x, H * 0.62, bed.z, Math.max(0.25, L - 0.24), H * 0.4, Math.max(0.25, W - 0.24), '#5a3821', false);

        const trimPt = project(bed.x, H * 0.5, bed.z + W / 2 + 0.03);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(trimPt.x, trimPt.y, isSel ? 5 : 3.5, 0, Math.PI * 2);
        ctx.fill();

        if (bed.statut === 'En culture' || bed.cultures) {
          drawCrops(bed, H * 0.85, L, W);
        }

        drawProtection(bed, H, L, W);

        hitPolys.push({ id: bed.id, poly: topPoly });

        const badgePt = project(bed.x, H + 0.65, bed.z);
        const surf = (L * W).toFixed(2).replace('.', ',');
        const dimLine = `${Number(bed.longueur)}×${Number(bed.largeur)}×${Number(bed.hauteur)}m • ${surf} m²`;

        ctx.font = 'bold 12px system-ui, sans-serif';
        const w1 = ctx.measureText(bed.nom).width;
        ctx.font = '10px system-ui, sans-serif';
        const w2 = ctx.measureText(dimLine).width;
        const bw = Math.max(w1, w2) + 18;
        const bh = 32;
        const bx = badgePt.x - bw / 2;
        const by = badgePt.y - bh / 2;

        ctx.fillStyle = isSel ? 'rgba(16, 48, 28, 0.94)' : 'rgba(10, 20, 14, 0.80)';
        ctx.strokeStyle = isSel ? '#4ade80' : 'rgba(255, 255, 255, 0.16)';
        ctx.lineWidth = isSel ? 1.8 : 1;
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(bed.nom, badgePt.x, by + 13);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '10px system-ui, sans-serif';
        ctx.fillText(dimLine, badgePt.x, by + 25);
      }
    }

    function insidePoly(px, py, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].x, yi = poly[i].y;
        const xj = poly[j].x, yj = poly[j].y;
        const hit = ((yi > py) !== (yj > py)) &&
          (px < (xj - xi) * (py - yi) / ((yj - yi) || 0.0001) + xi);
        if (hit) inside = !inside;
      }
      return inside;
    }

    let dragging = false;
    let moved = false;
    let lastPos = { x: 0, y: 0 };
    let pinchStartDist = 0;
    let pinchStartZoom = view.zoom;

    canvas.addEventListener('pointerdown', (e) => {
      dragging = true;
      moved = false;
      lastPos = { x: e.clientX, y: e.clientY };
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastPos.x;
      const dy = e.clientY - lastPos.y;
      if (Math.hypot(dx, dy) > 5) moved = true;
      lastPos = { x: e.clientX, y: e.clientY };

      view.yaw += dx * 0.009;
      view.pitch = Math.min(1.25, Math.max(0.25, view.pitch + dy * 0.007));
      render();
    });

    canvas.addEventListener('pointerup', (e) => {
      dragging = false;
      if (moved) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      for (let i = hitPolys.length - 1; i >= 0; i--) {
        if (insidePoly(x, y, hitPolys[i].poly)) {
          selectBed(hitPolys[i].id, true);
          return;
        }
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        pinchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        pinchStartZoom = view.zoom;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && pinchStartDist > 0) {
        const d = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        view.zoom = Math.min(50, Math.max(12, pinchStartZoom * (d / pinchStartDist)));
        render();
      }
    }, { passive: true });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      view.zoom = Math.min(50, Math.max(12, view.zoom - e.deltaY * 0.02));
      render();
    }, { passive: false });

    const stripEl = document.getElementById('bed-strip');
    function renderStrip() {
      stripEl.innerHTML = '';
      for (const b of beds) {
        const btn = document.createElement('button');
        btn.className = 'bed-pill' + (b.id === selectedId ? ' active' : '');
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = STATUS_COLORS[b.statut] || '#22c55e';
        btn.appendChild(dot);
        btn.appendChild(document.createTextNode(b.nom));
        btn.addEventListener('click', () => selectBed(b.id, true));
        stripEl.appendChild(btn);
      }
    }

    const drawer = document.getElementById('drawer');
    const edTitle = document.getElementById('ed-title');
    const edStatut = document.getElementById('ed-statut');
    const edProtection = document.getElementById('ed-protection');
    const edCultures = document.getElementById('ed-cultures');
    const edLongueur = document.getElementById('ed-longueur');
    const edLargeur = document.getElementById('ed-largeur');
    const edHauteur = document.getElementById('ed-hauteur');
    const edDate = document.getElementById('ed-date');
    const edNotes = document.getElementById('ed-notes');

    function getSelected() {
      return beds.find((b) => b.id === selectedId) || beds[0];
    }

    function syncDrawer() {
      const b = getSelected();
      edTitle.textContent = `${b.nom} (${b.id})`;
      edStatut.value = b.statut || 'Libre';
      edProtection.value = b.protection || 'Plein air (haut)';
      edCultures.value = b.cultures || '';
      edLongueur.value = b.longueur;
      edLargeur.value = b.largeur;
      edHauteur.value = b.hauteur;
      edDate.value = b.date || '';
      edNotes.value = b.notes || '';
    }

    function selectBed(id, openEd = false) {
      selectedId = id;
      renderStrip();
      syncDrawer();
      render();
      if (openEd) drawer.classList.add('open');
    }

    document.getElementById('btn-close-ed').addEventListener('click', () => {
      drawer.classList.remove('open');
    });

    document.getElementById('btn-save-ed').addEventListener('click', () => {
      const idx = beds.findIndex((b) => b.id === selectedId);
      if (idx === -1) return;
      beds[idx] = {
        ...beds[idx],
        statut: edStatut.value,
        protection: edProtection.value,
        cultures: edCultures.value.trim(),
        longueur: Math.max(0.5, Number(edLongueur.value) || 1),
        largeur: Math.max(0.5, Number(edLargeur.value) || 1),
        hauteur: Math.max(0.05, Number(edHauteur.value) || 0.2),
        date: edDate.value,
        notes: edNotes.value.trim()
      };
      saveBeds();
      updateSummary();
      renderStrip();
      render();
      toast(`${beds[idx].nom} enregistré`);
    });

    document.getElementById('btn-reset-ed').addEventListener('click', () => {
      const orig = INITIAL_BEDS.find((b) => b.id === selectedId);
      const idx = beds.findIndex((b) => b.id === selectedId);
      if (!orig || idx === -1) return;
      beds[idx] = JSON.parse(JSON.stringify(orig));
      saveBeds();
      updateSummary();
      renderStrip();
      syncDrawer();
      render();
      toast(`${orig.nom} réinitialisé`);
    });

    document.getElementById('btn-reset-view').addEventListener('click', () => {
      view = { ...DEFAULT_VIEW };
      render();
      toast('Vue réinitialisée');
    });

    const modalBg = document.getElementById('modal-bg');
    const modalCard = document.getElementById('modal-card');
    const importFile = document.getElementById('import-file');

    modalBg.addEventListener('click', (e) => {
      if (e.target === modalBg) modalBg.classList.remove('open');
    });

    function buildCSV() {
      const head = ['ID_Parcelle','Nom','Protection','Longueur_m','Largeur_m','Hauteur_m','Surface_m2','Volume_Terre_m3','Statut','Cultures_en_cours','Derniere_action','Notes'];
      const rows = [head.join(';')];
      for (const b of beds) {
        const s = (Number(b.longueur) * Number(b.largeur)).toFixed(2).replace('.', ',');
        const v = (Number(b.longueur) * Number(b.largeur) * Number(b.hauteur)).toFixed(2).replace('.', ',');
        rows.push([
          b.id,
          b.nom,
          b.protection,
          Number(b.longueur).toFixed(2).replace('.', ','),
          Number(b.largeur).toFixed(2).replace('.', ','),
          Number(b.hauteur).toFixed(2).replace('.', ','),
          s,
          v,
          b.statut,
          b.cultures || '',
          b.date || '',
          (b.notes || '').replace(/;/g, ',')
        ].join(';'));
      }
      return rows.join('\n');
    }

    function triggerDownload(name, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    document.getElementById('btn-sync').addEventListener('click', () => {
      const csvText = buildCSV();
      modalCard.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <h3 style="margin:0;">Sync Sheets (CSV / JSON)</h3>
          <button class="btn-sm" id="m-x">✕</button>
        </div>
        <p style="font-size:0.82rem;color:#98b8a2;margin:0 0 10px 0;">
          Exporte vers ton tableur <strong>Mon Jardin - Pilotage</strong> ou importe un fichier CSV / JSON.
        </p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <button class="btn-sm save" id="m-csv">Exporter CSV</button>
          <button class="btn-sm" id="m-json">Exporter JSON</button>
          <button class="btn-sm" id="m-imp">Importer</button>
          <button class="btn-sm" id="m-all-reset">Tout réinitialiser</button>
        </div>
        <pre>${csvText}</pre>
      `;
      modalBg.classList.add('open');
      document.getElementById('m-x').onclick = () => modalBg.classList.remove('open');
      document.getElementById('m-csv').onclick = () => {
        triggerDownload('mon-jardin-pilotage.csv', buildCSV(), 'text/csv;charset=utf-8;');
        toast('CSV exporté');
      };
      document.getElementById('m-json').onclick = () => {
        triggerDownload('mon-jardin-pilotage.json', JSON.stringify(beds, null, 2), 'application/json');
        toast('JSON exporté');
      };
      document.getElementById('m-imp').onclick = () => importFile.click();
      document.getElementById('m-all-reset').onclick = () => {
        beds = cloneInitial();
        saveBeds();
        updateSummary();
        renderStrip();
        syncDrawer();
        render();
        modalBg.classList.remove('open');
        toast('12 carrés réinitialisés');
      };
    });

    importFile.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const txt = String(reader.result || '');
        try {
          if (file.name.endsWith('.json') || txt.trim().startsWith('[')) {
            const arr = JSON.parse(txt);
            if (Array.isArray(arr) && arr.length === 12) {
              beds = arr;
              saveBeds();
              updateSummary();
              renderStrip();
              syncDrawer();
              render();
              modalBg.classList.remove('open');
              toast('JSON importé');
              return;
            }
          }
          const lines = txt.split(/\r?\n/).filter((l) => l.trim());
          if (lines.length >= 2) {
            const toNum = (v) => parseFloat(String(v || '').replace(',', '.')) || 1;
            const next = [...beds];
            for (let i = 1; i < lines.length; i++) {
              const c = lines[i].split(';');
              if (c.length < 2) continue;
              const idx = next.findIndex((b) => b.id === c[0].trim() || b.nom.toLowerCase() === c[1].trim().toLowerCase());
              if (idx !== -1) {
                next[idx] = {
                  ...next[idx],
                  nom: c[1]?.trim() || next[idx].nom,
                  protection: c[2]?.trim() || next[idx].protection,
                  longueur: c[3] ? toNum(c[3]) : next[idx].longueur,
                  largeur: c[4] ? toNum(c[4]) : next[idx].largeur,
                  hauteur: c[5] ? toNum(c[5]) : next[idx].hauteur,
                  statut: c[8]?.trim() || next[idx].statut,
                  cultures: c[9]?.trim() ?? next[idx].cultures,
                  date: c[10]?.trim() ?? next[idx].date,
                  notes: c[11]?.trim() ?? next[idx].notes
                };
              }
            }
            beds = next;
            saveBeds();
            updateSummary();
            renderStrip();
            syncDrawer();
            render();
            modalBg.classList.remove('open');
            toast('CSV importé');
          }
        } catch {
          toast('Fichier non reconnu');
        }
      };
      reader.readAsText(file);
      importFile.value = '';
    });

    window.addEventListener('resize', resize);
    updateSummary();
    renderStrip();
    syncDrawer();
    resize();
  </script>
</body>
</html>
