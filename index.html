<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#102418" />
  <title>Mon Jardin - Pilotage 3D</title>
  <style>
    :root {
      --bg: #0c1d13;
      --card: rgba(14, 34, 21, 0.90);
      --card-border: rgba(102, 184, 122, 0.24);
      --text: #f3f9f4;
      --muted: #98b8a2;
      --green: #22c55e;
      --green-dark: #15803d;
      --amber: #f59e0b;
      --blue: #38bdf8;
      --red: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      touch-action: none;
    }
    #canvas-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .topbar {
      position: fixed;
      top: env(safe-area-inset-top, 8px);
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }
    .brand {
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      min-width: 0;
    }
    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      flex: 0 0 auto;
    }
    .brand-title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      gap: 5px;
      align-items: center;
      flex: 0 0 auto;
    }
    button {
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      border-radius: 11px;
      padding: 7px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: transform 0.12s ease, background 0.15s ease, opacity 0.15s ease;
    }
    button:active:not(:disabled) { transform: scale(0.96); }
    button:disabled { opacity: 0.38; cursor: not-allowed; }
    button.primary {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      border-color: rgba(134, 239, 172, 0.4);
      color: #fff;
    }
    button.danger {
      background: rgba(127, 29, 29, 0.75);
      border-color: rgba(248, 113, 113, 0.45);
      color: #fecaca;
    }
    button.active-pill {
      background: rgba(34, 197, 94, 0.24);
      border-color: #4ade80;
      color: #bbf7d0;
    }

    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 8px) + 52px);
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 40;
      background: rgba(10, 27, 17, 0.94);
      border: 1px solid rgba(74, 222, 128, 0.45);
      color: #dcfce7;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .drawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      max-height: 76vh;
      background: rgba(11, 27, 18, 0.96);
      border-top: 1px solid var(--card-border);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      backdrop-filter: blur(18px);
      transform: translateY(105%);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 0 -14px 40px rgba(0,0,0,0.55);
    }
    .drawer.open { transform: translateY(0); }
    .drawer-handle-zone {
      padding: 10px 16px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .drawer-handle {
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 184, 162, 0.45);
      margin-bottom: 8px;
    }
    .drawer-head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .drawer-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drawer-body {
      padding: 6px 16px calc(env(safe-area-inset-bottom, 14px) + 14px);
      overflow-y: auto;
      display: grid;
      gap: 12px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      background: rgba(7, 19, 12, 0.9);
      border: 1px solid rgba(134, 239, 172, 0.25);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--green);
    }
    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .preset-btn {
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 8px;
      background: rgba(13, 33, 21, 0.92);
    }
    .shape-box {
      background: rgba(7, 19, 12, 0.72);
      border: 1px solid rgba(134, 239, 172, 0.18);
      border-radius: 12px;
      padding: 10px;
    }
    .shape-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .shape-grid {
      display: grid;
      gap: 4px;
      justify-content: center;
      margin: 0 auto;
      max-width: 260px;
    }
    .shape-cell {
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      border: 1px solid rgba(134, 239, 172, 0.22);
      background: rgba(18, 41, 27, 0.65);
      color: #98b8a2;
      font-size: 10px;
      font-weight: 700;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shape-cell.active {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.85), rgba(21, 128, 61, 0.92));
      border-color: #86efac;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.35);
    }
    .veg-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20, 46, 30, 0.75);
      border: 1px solid rgba(134, 239, 172, 0.2);
      border-radius: 12px;
      padding: 8px 10px;
    }
    .veg-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(9, 24, 15, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border: 1px solid rgba(134, 239, 172, 0.25);
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 540px;
      max-height: 86vh;
      overflow-y: auto;
      background: #0e2317;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.65);
    }
    .modal h3 { margin: 0 0 8px; font-size: 16px; }
    .modal p { margin: 0 0 10px; font-size: 12px; color: var(--muted); line-height: 1.45; }
    textarea { min-height: 140px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-title">Mon Jardin - Pilotage 3D</span>
    </div>
    <div class="actions">
      <button id="btn-undo" title="Précédent (Ctrl+Z)" disabled>↶</button>
      <button id="btn-redo" title="Suivant (Ctrl+Y)" disabled>↷</button>
      <button id="btn-add" class="primary">+ Carré</button>
      <button id="btn-sync">⇅ Sync</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <aside id="drawer" class="drawer" aria-label="Éditeur de carré potager">
    <div id="drawer-handle-zone" class="drawer-handle-zone">
      <div class="drawer-handle"></div>
      <div class="drawer-head">
        <div class="drawer-title">
          <span id="drawer-code">P-01</span>
          <span id="drawer-name-preview">Carré Nord</span>
        </div>
        <button id="btn-close-drawer">✕</button>
      </div>
    </div>
    <div class="drawer-body">
      <div class="veg-preview">
        <div id="veg-svg-preview" class="veg-badge"></div>
        <div style="flex:1; min-width:0;">
          <div id="veg-preview-title" style="font-size:13px; font-weight:700;">Tomate</div>
          <div id="veg-preview-sub" style="font-size:11px; color:var(--muted);">Modules 1m×1m • Rotation 0°</div>
        </div>
        <button id="btn-rotate-90" class="primary">↻ +90°</button>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="inp-name">Nom du carré</label>
          <input id="inp-name" type="text" maxlength="40" />
        </div>
        <div class="field">
          <label for="sel-veg">Culture (SVG sur terre)</label>
          <select id="sel-veg"></select>
        </div>
      </div>

      <div class="grid-3">
        <div class="field">
          <label for="sel-w">Largeur (1m–4m)</label>
          <select id="sel-w">
            <option value="1">1 m (1 module)</option>
            <option value="2">2 m (2 modules)</option>
            <option value="3">3 m (3 modules)</option>
            <option value="4">4 m (4 modules)</option>
          </select>
        </div>
        <div class="field">
          <label for="sel-d">Profondeur (1m–10m)</label>
          <select id="sel-d">
            <option value="1">1 m</option>
            <option value="2">2 m</option>
            <option value="3">3 m</option>
            <option value="4">4 m</option>
            <option value="5">5 m</option>
            <option value="6">6 m</option>
            <option value="7">7 m</option>
            <option value="8">8 m</option>
            <option value="9">9 m</option>
            <option value="10">10 m</option>
          </select>
        </div>
        <div class="field">
          <label for="sel-rot">Orientation</label>
          <select id="sel-rot">
            <option value="0">0° (Nord)</option>
            <option value="90">90° (Est)</option>
            <option value="180">180° (Sud)</option>
            <option value="270">270° (Ouest)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Forme modulaire 1m × 1m (touchez les cases pour sculpter le carré)</label>
        <div class="shape-box">
          <div class="shape-top">
            <span id="shape-summary">4 modules actifs (1m×1m)</span>
            <div style="display:flex; gap:6px;">
              <button type="button" id="btn-shape-1x1" class="preset-btn">1m×1m</button>
              <button type="button" id="btn-shape-full" class="preset-btn">Plein</button>
            </div>
          </div>
          <div id="shape-grid" class="shape-grid"></div>
        </div>
        <div class="preset-row">
          <button type="button" class="preset-btn" data-preset="1x1">1m×1m</button>
          <button type="button" class="preset-btn" data-preset="2x1">2m×1m</button>
          <button type="button" class="preset-btn" data-preset="2x2">2m×2m</button>
          <button type="button" class="preset-btn" data-preset="3x2">3m×2m</button>
          <button type="button" class="preset-btn" data-preset="1x5">1m×5m</button>
          <button type="button" class="preset-btn" data-preset="2x10">2m×10m</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="sel-mat">Paroi ondulée</label>
          <select id="sel-mat">
            <option value="rust">Acier Corten Rouille</option>
            <option value="terracotta">Terre Cuite Ondulée</option>
            <option value="oak">Bois Chêne Structuré</option>
          </select>
        </div>
        <div class="field">
          <label for="sel-status">État de culture</label>
          <select id="sel-status">
            <option value="actif">En croissance</option>
            <option value="recolte">Prêt à récolter</option>
            <option value="repos">Repos / Compost</option>
            <option value="semis">Semis récent</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Protection serre</label>
          <button type="button" id="btn-toggle-greenhouse" style="width:100%;">🏡 Serre : OFF</button>
        </div>
        <div class="field">
          <label>Protection insectes</label>
          <button type="button" id="btn-toggle-net" style="width:100%;">🦋 Filet papillon : OFF</button>
        </div>
      </div>

      <div class="field">
        <label for="inp-notes">Notes de pilotage</label>
        <input id="inp-notes" type="text" maxlength="120" placeholder="Arrosage goutte-à-goutte, paillage..." />
      </div>

      <div class="row-actions" style="justify-content: space-between; margin-top: 4px;">
        <button id="btn-delete" class="danger">Supprimer ce carré</button>
        <button id="btn-done" class="primary">Valider</button>
      </div>
    </div>
  </aside>

  <div id="sync-modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Synchronisation CSV / JSON (RFC-4180)</h3>
      <p>Sauvegarde automatique dans <code>localStorage</code>. Exportez ou importez vos carrés au format CSV ou JSON.</p>
      <div class="row-actions" style="margin-top:0; margin-bottom:10px;">
        <button id="btn-export-csv" class="primary">Exporter CSV</button>
        <button id="btn-export-json">Exporter JSON</button>
        <button id="btn-copy-buf">Copier</button>
        <button id="btn-reset-demo" class="danger">Réinitialiser démo</button>
      </div>
      <textarea id="sync-textarea" placeholder="Collez ici un CSV RFC-4180 ou un JSON..."></textarea>
      <div class="row-actions">
        <button id="btn-import-csv" class="primary">Importer CSV</button>
        <button id="btn-import-json">Importer JSON</button>
        <button id="btn-close-sync" style="margin-left:auto;">Fermer</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function () {
      const STORAGE_KEY = "mon_jardin_pilotage_3d_v1";
      const SCALE = 2.8;
      const WALL_H = 0.62;
      const SOIL_H = 0.50;
      const MAX_W = 4;
      const MAX_D = 10;
      const MAX_HISTORY = 60;

      const VEGETABLES = [
        { id: "tomate", label: "Tomate", color: "#ef4444", accent: "#22c55e" },
        { id: "carotte", label: "Carotte", color: "#f97316", accent: "#4ade80" },
        { id: "laitue", label: "Laitue", color: "#4ade80", accent: "#16a34a" },
        { id: "fraise", label: "Fraise", color: "#f43f5e", accent: "#86efac" },
        { id: "courgette", label: "Courgette", color: "#22c55e", accent: "#eab308" },
        { id: "radis", label: "Radis", color: "#ec4899", accent: "#4ade80" },
        { id: "oignon", label: "Oignon", color: "#eab308", accent: "#84cc16" },
        { id: "poivron", label: "Poivron", color: "#ef4444", accent: "#facc15" },
        { id: "haricot", label: "Haricot vert", color: "#16a34a", accent: "#86efac" },
        { id: "pomme_de_terre", label: "Pomme de terre", color: "#d97706", accent: "#4ade80" },
        { id: "aubergine", label: "Aubergine", color: "#9333ea", accent: "#4ade80" },
        { id: "basilic", label: "Basilic", color: "#22c55e", accent: "#bbf7d0" },
        { id: "chou", label: "Chou kale", color: "#15803d", accent: "#a3e635" },
        { id: "ail", label: "Ail", color: "#e2e8f0", accent: "#4ade80" }
      ];

      function getVeg(id) {
        return VEGETABLES.find(v => v.id === id) || VEGETABLES[0];
      }

      function vegetableSvgMarkup(vegId, size = 34) {
        const v = getVeg(vegId);
        const icons = {
          tomate: `<circle cx="32" cy="36" r="16" fill="${v.color}" stroke="#7f1d1d" stroke-width="2.5"/><path d="M32 15 L28 23 L21 20 L26 26 L32 24 L38 26 L43 20 L36 23 Z" fill="${v.accent}"/>`,
          carotte: `<path d="M22 18 L42 24 L27 51 C25 54 21 53 20 50 Z" fill="${v.color}" stroke="#9a3412" stroke-width="2"/><path d="M33 19 L36 9 M37 21 L44 12 M30 18 L27 10" stroke="${v.accent}" stroke-width="3" stroke-linecap="round"/>`,
          laitue: `<path d="M16 38 C13 24 22 14 32 14 C42 14 51 24 48 38 C44 47 20 47 16 38 Z" fill="${v.color}" stroke="#14532d" stroke-width="2.5"/><path d="M22 25 Q32 32 42 25 M20 35 Q32 41 44 35" fill="none" stroke="${v.accent}" stroke-width="2.2" stroke-linecap="round"/>`,
          fraise: `<path d="M32 52 C20 43 17 28 23 21 C27 17 37 17 41 21 C47 28 44 43 32 52 Z" fill="${v.color}" stroke="#881337" stroke-width="2"/><path d="M24 19 L32 23 L40 19 L35 14 L29 14 Z" fill="${v.accent}"/><circle cx="27" cy="29" r="1.5" fill="#fef08a"/><circle cx="37" cy="29" r="1.5" fill="#fef08a"/><circle cx="32" cy="36" r="1.5" fill="#fef08a"/><circle cx="28" cy="42" r="1.5" fill="#fef08a"/><circle cx="36" cy="42" r="1.5" fill="#fef08a"/>`,
          courgette: `<path d="M17 42 C16 27 30 15 47 16 C48 33 36 47 21 46 Z" fill="${v.color}" stroke="#14532d" stroke-width="2.5"/><path d="M24 38 L39 23 M29 41 L42 28" stroke="${v.accent}" stroke-width="2.2" stroke-linecap="round"/>`,
          radis: `<circle cx="32" cy="37" r="14" fill="${v.color}" stroke="#831843" stroke-width="2.2"/><path d="M32 23 L32 11 M32 23 L23 13 M32 23 L41 13" stroke="${v.accent}" stroke-width="2.8" stroke-linecap="round"/>`,
          oignon: `<path d="M32 17 C22 24 18 33 20 42 C22 48 27 50 32 50 C37 50 42 48 44 42 C46 33 42 24 32 17 Z" fill="${v.color}" stroke="#854d0e" stroke-width="2.2"/><path d="M32 17 L32 10" stroke="${v.accent}" stroke-width="3" stroke-linecap="round"/>`,
          poivron: `<rect x="18" y="22" width="28" height="27" rx="10" fill="${v.color}" stroke="#7f1d1d" stroke-width="2.2"/><path d="M32 22 L32 13" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/><path d="M24 29 L24 42" stroke="${v.accent}" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>`,
          haricot: `<path d="M18 44 C19 25 33 15 47 18 C44 33 34 45 18 44 Z" fill="${v.color}" stroke="#14532d" stroke-width="2"/><circle cx="26" cy="37" r="3" fill="${v.accent}"/><circle cx="33" cy="30" r="3" fill="${v.accent}"/><circle cx="40" cy="23" r="3" fill="${v.accent}"/>`,
          pomme_de_terre: `<ellipse cx="32" cy="35" rx="17" ry="13" transform="rotate(-14 32 35)" fill="${v.color}" stroke="#78350f" stroke-width="2.2"/><circle cx="26" cy="32" r="1.6" fill="#fef3c7"/><circle cx="37" cy="37" r="1.6" fill="#fef3c7"/>`,
          aubergine: `<path d="M22 21 C34 19 46 28 45 41 C44 49 35 52 26 48 C19 44 17 31 22 21 Z" fill="${v.color}" stroke="#4c1d95" stroke-width="2.2"/><path d="M21 20 L15 16 M23 22 L18 27" stroke="${v.accent}" stroke-width="3" stroke-linecap="round"/>`,
          basilic: `<path d="M32 49 C20 45 16 32 22 21 C26 15 38 15 42 21 C48 32 44 45 32 49 Z" fill="${v.color}" stroke="#14532d" stroke-width="2"/><path d="M32 21 L32 47 M32 30 L25 25 M32 36 L39 31" stroke="${v.accent}" stroke-width="2" stroke-linecap="round"/>`,
          chou: `<circle cx="32" cy="34" r="16" fill="${v.color}" stroke="#14532d" stroke-width="2.4"/><path d="M21 26 C27 32 37 32 43 26 M19 37 C27 42 37 42 45 37" fill="none" stroke="${v.accent}" stroke-width="2.3" stroke-linecap="round"/>`,
          ail: `<path d="M32 15 C23 23 18 32 19 41 C20 47 25 50 32 50 C39 50 44 47 45 41 C46 32 41 23 32 15 Z" fill="${v.color}" stroke="#64748b" stroke-width="2.2"/><path d="M32 16 L32 49 M25 24 Q24 37 26 48 M39 24 Q40 37 38 48" fill="none" stroke="#94a3b8" stroke-width="1.8"/>`
        };
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="${size}" height="${size}">${icons[vegId] || icons.tomate}</svg>`;
      }

      function clampDim(val, min, max) {
        const n = parseInt(val, 10);
        if (Number.isNaN(n)) return min;
        return Math.max(min, Math.min(max, n));
      }

      function normalizeRot(deg) {
        const n = ((parseInt(deg, 10) || 0) % 360 + 360) % 360;
        return [0, 90, 180, 270].includes(n) ? n : 0;
      }

      function createFullCells(w, d) {
        const cw = clampDim(w, 1, MAX_W);
        const cd = clampDim(d, 1, MAX_D);
        const cells = [];
        for (let z = 0; z < cd; z++) {
          const row = [];
          for (let x = 0; x < cw; x++) row.push(1);
          cells.push(row);
        }
        return cells;
      }

      function normalizeCells(rawCells, w, d) {
        const cw = clampDim(w, 1, MAX_W);
        const cd = clampDim(d, 1, MAX_D);
        const cells = [];
        let activeCount = 0;
        for (let z = 0; z < cd; z++) {
          const row = [];
          for (let x = 0; x < cw; x++) {
            const val = Array.isArray(rawCells) && Array.isArray(rawCells[z]) && rawCells[z][x] ? 1 : 0;
            if (val) activeCount++;
            row.push(val);
          }
          cells.push(row);
        }
        if (activeCount === 0) {
          cells[0][0] = 1;
        }
        return cells;
      }

      function countActiveCells(cells) {
        let count = 0;
        for (const row of cells) {
          for (const v of row) {
            if (v) count++;
          }
        }
        return Math.max(1, count);
      }

      function normalizeBed(raw, idx = 0) {
        const code = (raw && raw.code) ? String(raw.code).trim() : `P-${String(idx + 1).padStart(2, "0")}`;
        const name = (raw && raw.name) ? String(raw.name).trim() : `Carré ${idx + 1}`;
        const w = clampDim(raw && raw.w, 1, MAX_W);
        const d = clampDim(raw && raw.d, 1, MAX_D);
        const x = Number.isFinite(Number(raw && raw.x)) ? Number(raw.x) : ((idx % 4) - 1.5) * 8.5;
        const z = Number.isFinite(Number(raw && raw.z)) ? Number(raw.z) : (Math.floor(idx / 4) - 1) * 8.5;
        const rot = normalizeRot(raw && raw.rot);
        const mat = ["rust", "terracotta", "oak"].includes(raw && raw.mat) ? raw.mat : "rust";
        const veg = getVeg(raw && raw.veg).id;
        const status = ["actif", "recolte", "repos", "semis"].includes(raw && raw.status) ? raw.status : "actif";
        const greenhouse = Boolean(raw && raw.greenhouse);
        const net = Boolean(raw && raw.net);
        const notes = raw && raw.notes ? String(raw.notes) : "";
        const cells = normalizeCells(raw && raw.cells, w, d);
        return { id: code, code, name, w, d, x, z, rot, mat, veg, status, greenhouse, net, notes, cells };
      }

      function cloneBeds(list) {

      function loadBeds() {

          if (!raw) return createDefaultBeds();
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed) || parsed.length === 0) return createDefaultBeds();
          return parsed.map((b, i) => normalizeBed(b, i));
        } catch (err) {
          return createDefaultBeds();
        }

      function makeCorrugatedTexture(baseHex, ribHex, detailHex) {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 128;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = baseHex;
        ctx.fillRect(0, 0, 256, 128);

        const ribs = 32;
        const step = 256 / ribs;
        for (let i = 0; i < ribs; i++) {
          const x = i * step;
          const grad = ctx.createLinearGradient(x, 0, x + step, 0);
          grad.addColorStop(0, ribHex);
          grad.addColorStop(0.5, baseHex);
          grad.addColorStop(1, detailHex);
          ctx.fillStyle = grad;
          ctx.fillRect(x, 0, step, 128);
        }

        ctx.fillStyle = "rgba(0,0,0,0.16)";
        ctx.fillRect(0, 0, 256, 7);
        ctx.fillRect(0, 121, 256, 7);

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.needsUpdate = true;
        return tex;
      }

      function getVegetableSoilTexture(vegId) {
        if (vegTextureCache.has(vegId)) return vegTextureCache.get(vegId);
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "#2d1c10";
        ctx.fillRect(0, 0, 256, 256);

        for (let i = 0; i < 420; i++) {
          const sx = (i * 73) % 256;
          const sy = (i * 137) % 256;
          ctx.fillStyle = i % 2 === 0 ? "rgba(62, 39, 22, 0.45)" : "rgba(25, 15, 8, 0.45)";
          ctx.fillRect(sx, sy, 3, 3);
        }

        const svgStr = vegetableSvgMarkup(vegId, 176);
        const img = new Image();
        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;

        img.onload = () => {
          ctx.drawImage(img, 40, 40, 176, 176);
          tex.needsUpdate = true;
        };
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);

        vegTextureCache.set(vegId, tex);
        return tex;

      function buildSingleBedMesh(bed) {
        const root = new THREE.Group();
        root.userData.bedId = bed.id;

        const matCfg = MAT_CONFIGS[bed.mat] || MAT_CONFIGS.rust;
        const wallMat = new THREE.MeshStandardMaterial({
          map: matCfg.tex,
          roughness: matCfg.roughness,
          metalness: matCfg.metalness
        });
        const cornerMat = new THREE.MeshStandardMaterial({
          color: matCfg.corner,
          roughness: 0.55,
          metalness: 0.35
        });

        const cellSize = SCALE;
        const totalW = bed.w * cellSize;
        const totalD = bed.d * cellSize;
        const offsetX = -totalW / 2;
        const offsetZ = -totalD / 2;

        const highlightMat = new THREE.MeshBasicMaterial({
          color: "#4ade80",
          transparent: true,
          opacity: 0.0,
          side: THREE.DoubleSide,
          depthWrite: false
        });

        const hitMeshes = [];

        for (let gz = 0; gz < bed.d; gz++) {
          for (let gx = 0; gx < bed.w; gx++) {
            if (!bed.cells[gz][gx]) continue;

            const cx = offsetX + (gx + 0.5) * cellSize;
            const cz = offsetZ + (gz + 0.5) * cellSize;

            const cellGroup = new THREE.Group();
            cellGroup.position.set(cx, 0, cz);
            cellGroup.userData.bedId = bed.id;

            const soilMesh = new THREE.Mesh(
              new THREE.BoxGeometry(cellSize * 0.98, SOIL_H, cellSize * 0.98),
              soilMat
            );
            soilMesh.position.y = SOIL_H / 2;
            soilMesh.castShadow = true;
            soilMesh.receiveShadow = true;
            soilMesh.userData.bedId = bed.id;
            cellGroup.add(soilMesh);
            hitMeshes.push(soilMesh);

            const iconPlane = new THREE.Mesh(
              new THREE.PlaneGeometry(cellSize * 0.72, cellSize * 0.72),
              new THREE.MeshBasicMaterial({
                map: getVegetableSoilTexture(bed.veg),
                transparent: true,
                depthWrite: false
              })
            );
            iconPlane.rotation.x = -Math.PI / 2;
            iconPlane.position.y = SOIL_H + 0.012;
            iconPlane.userData.bedId = bed.id;
            cellGroup.add(iconPlane);

            const hasN = gz > 0 && bed.cells[gz - 1][gx];
            const hasS = gz < bed.d - 1 && bed.cells[gz + 1][gx];
            const hasW = gx > 0 && bed.cells[gz][gx - 1];
            const hasE = gx < bed.w - 1 && bed.cells[gz][gx + 1];

            const t = 0.14;
            if (!hasN) {
              const m = new THREE.Mesh(new THREE.BoxGeometry(cellSize, WALL_H, t), wallMat);
              m.position.set(0, WALL_H / 2, -cellSize / 2 + t / 2);
              m.castShadow = true;
              m.receiveShadow = true;
              m.userData.bedId = bed.id;
              cellGroup.add(m);
              hitMeshes.push(m);
            }
            if (!hasS) {
              const m = new THREE.Mesh(new THREE.BoxGeometry(cellSize, WALL_H, t), wallMat);
              m.position.set(0, WALL_H / 2, cellSize / 2 - t / 2);
              m.castShadow = true;
              m.receiveShadow = true;
              m.userData.bedId = bed.id;
              cellGroup.add(m);
              hitMeshes.push(m);
            }
            if (!hasW) {
              const m = new THREE.Mesh(new THREE.BoxGeometry(t, WALL_H, cellSize), wallMat);
              m.position.set(-cellSize / 2 + t / 2, WALL_H / 2, 0);
              m.castShadow = true;
              m.receiveShadow = true;
              m.userData.bedId = bed.id;
              cellGroup.add(m);
              hitMeshes.push(m);
            }
            if (!hasE) {
              const m = new THREE.Mesh(new THREE.BoxGeometry(t, WALL_H, cellSize), wallMat);
              m.position.set(cellSize / 2 - t / 2, WALL_H / 2, 0);
              m.castShadow = true;
              m.receiveShadow = true;
              m.userData.bedId = bed.id;
              cellGroup.add(m);
              hitMeshes.push(m);
            }

            const corners = [
              [-1, -1], [1, -1], [-1, 1], [1, 1]
            ];
            for (const [sx, sz] of corners) {
              const post = new THREE.Mesh(
                new THREE.BoxGeometry(0.18, WALL_H + 0.04, 0.18),
                cornerMat
              );
              post.position.set(sx * (cellSize / 2 - 0.09), (WALL_H + 0.04) / 2, sz * (cellSize / 2 - 0.09));
              post.castShadow = true;
              post.userData.bedId = bed.id;
              cellGroup.add(post);

              const rivet = new THREE.Mesh(
                new THREE.SphereGeometry(0.035, 8, 8),
                frameMat
              );
              rivet.position.set(sx * (cellSize / 2 - 0.03), WALL_H - 0.12, sz * (cellSize / 2 - 0.03));
              cellGroup.add(rivet);
            }

            const aura = new THREE.Mesh(
              new THREE.PlaneGeometry(cellSize * 0.96, cellSize * 0.96),
              highlightMat
            );
            aura.rotation.x = -Math.PI / 2;
            aura.position.y = WALL_H + 0.03;
            cellGroup.add(aura);

            root.add(cellGroup);
          }
        }

        if (bed.greenhouse) {
          const ghGroup = new THREE.Group();
          const ghBaseY = WALL_H;
          const ghWallH = 1.15;
          const ridgeH = 0.72;
          const margin = 0.08;
          const gw = Math.max(0.6, totalW - margin * 2);
          const gd = Math.max(0.6, totalD - margin * 2);

          const sideWallGeo = new THREE.PlaneGeometry(gd, ghWallH);
          const leftGlass = new THREE.Mesh(sideWallGeo, glassMat);
          leftGlass.position.set(-gw / 2, ghBaseY + ghWallH / 2, 0);
          leftGlass.rotation.y = Math.PI / 2;
          ghGroup.add(leftGlass);

          const rightGlass = new THREE.Mesh(sideWallGeo, glassMat);
          rightGlass.position.set(gw / 2, ghBaseY + ghWallH / 2, 0);
          rightGlass.rotation.y = -Math.PI / 2;
          ghGroup.add(rightGlass);

          const frontGlass = new THREE.Mesh(new THREE.PlaneGeometry(gw, ghWallH), glassMat);
          frontGlass.position.set(0, ghBaseY + ghWallH / 2, gd / 2);
          ghGroup.add(frontGlass);

          const backGlass = new THREE.Mesh(new THREE.PlaneGeometry(gw, ghWallH), glassMat);
          backGlass.position.set(0, ghBaseY + ghWallH / 2, -gd / 2);
          backGlass.rotation.y = Math.PI;
          ghGroup.add(backGlass);

          const slopeLen = Math.hypot(gw / 2, ridgeH);
          const slopeAngle = Math.atan2(ridgeH, gw / 2);
          const roofGeo = new THREE.PlaneGeometry(slopeLen, gd);

          const roofLeft = new THREE.Mesh(roofGeo, glassMat);
          roofLeft.position.set(-gw / 4, ghBaseY + ghWallH + ridgeH / 2, 0);
          roofLeft.rotation.z = slopeAngle;
          roofLeft.rotation.y = Math.PI / 2;
          ghGroup.add(roofLeft);

          const roofRight = new THREE.Mesh(roofGeo, glassMat);
          roofRight.position.set(gw / 4, ghBaseY + ghWallH + ridgeH / 2, 0);
          roofRight.rotation.z = -slopeAngle;
          roofRight.rotation.y = -Math.PI / 2;
          ghGroup.add(roofRight);

          const ridgeBeam = new THREE.Mesh(
            new THREE.CylinderGeometry(0.035, 0.035, gd, 8),
            frameMat
          );
          ridgeBeam.rotation.x = Math.PI / 2;
          ridgeBeam.position.set(0, ghBaseY + ghWallH + ridgeH, 0);
          ghGroup.add(ridgeBeam);

          const postCoords = [
            [-gw / 2, -gd / 2], [gw / 2, -gd / 2],
            [-gw / 2, gd / 2], [gw / 2, gd / 2]
          ];
          for (const [px, pz] of postCoords) {
            const p = new THREE.Mesh(
              new THREE.CylinderGeometry(0.03, 0.03, ghWallH, 8),
              frameMat
            );
            p.position.set(px, ghBaseY + ghWallH / 2, pz);
            ghGroup.add(p);
          }

          root.add(ghGroup);
        }

        if (bed.net) {
          const netGroup = new THREE.Group();
          const netBaseY = WALL_H;
          const archR = Math.max(0.45, totalW * 0.46);
          const len = Math.max(0.6, totalD - 0.12);

          const tunnelGeo = new THREE.CylinderGeometry(
            archR,
            archR,
            len,
            20,
            1,
            true,
            -Math.PI / 2,
            Math.PI
          );
          tunnelGeo.rotateZ(Math.PI / 2);
          tunnelGeo.rotateY(Math.PI / 2);
          const tunnelMesh = new THREE.Mesh(tunnelGeo, netMat);
          tunnelMesh.position.set(0, netBaseY, 0);
          netGroup.add(tunnelMesh);

          const ribCount = Math.max(2, Math.min(12, Math.round(len / 1.4) + 1));
          for (let i = 0; i < ribCount; i++) {
            const frac = ribCount === 1 ? 0.5 : i / (ribCount - 1);
            const zPos = -len / 2 + frac * len;
            const hoopGeo = new THREE.TorusGeometry(archR, 0.025, 8, 24, Math.PI);
            const hoop = new THREE.Mesh(hoopGeo, netRibMat);
            hoop.position.set(0, netBaseY, zPos);
            netGroup.add(hoop);
          }

          root.add(netGroup);
        }

        root.position.set(bed.x, 0, bed.z);
        root.rotation.y = THREE.MathUtils.degToRad(bed.rot);

        return { root, hitMeshes, highlightMat };
      }

      function rebuildAllBeds() {

          bedVisuals.set(bed.id, built);
        }

      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();
      const groundIntersectPt = new THREE.Vector3();
      const groundHitPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

      let isDraggingBed = false;
      let isOrbiting = false;
      let draggedBedId = null;
      let dragStartRecorded = false;
      let dragOffset = new THREE.Vector3();
      let pointerDownPos = { x: 0, y: 0 };
      let lastOrbitPos = { x: 0, y: 0 };
      let lastTapInfo = { bedId: null, time: 0 };
      let orbitYaw = 0;
      let orbitPitch = 0.88;
      let orbitDist = 36;
      const orbitTarget = new THREE.Vector3(0, 0, 0);

      function updateCameraFromOrbit() {
        const clampedPitch = Math.max(0.28, Math.min(1.38, orbitPitch));
        const clampedDist = Math.max(12, Math.min(75, orbitDist));
        orbitPitch = clampedPitch;
        orbitDist = clampedDist;

        camera.position.x = orbitTarget.x + clampedDist * Math.sin(orbitYaw) * Math.cos(clampedPitch);
        camera.position.y = orbitTarget.y + clampedDist * Math.sin(clampedPitch);
        camera.position.z = orbitTarget.z + clampedDist * Math.cos(orbitYaw) * Math.cos(clampedPitch);
        camera.lookAt(orbitTarget);
      }
      updateCameraFromOrbit();

      function setPointerNDC(clientX, clientY) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      }

      function pickBedAt(clientX, clientY) {
        setPointerNDC(clientX, clientY);
        raycaster.setFromCamera(pointerNDC, camera);
        const candidates = [];
        for (const [, v] of bedVisuals.entries()) {
          candidates.push(...v.hitMeshes);
        }
        const hits = raycaster.intersectObjects(candidates, false);
        if (hits.length > 0) {
          return hits[0].object.userData.bedId || null;
        }
        return null;
      }

      renderer.domElement.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        renderer.domElement.setPointerCapture(e.pointerId);
        pointerDownPos = { x: e.clientX, y: e.clientY };
        lastOrbitPos = { x: e.clientX, y: e.clientY };

        const hitBedId = pickBedAt(e.clientX, e.clientY);
        if (hitBedId) {
          selectedId = hitBedId;
          const bed = getSelectedBed();
          setPointerNDC(e.clientX, e.clientY);
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(groundHitPlane, groundIntersectPt) && bed) {
            isDraggingBed = true;
            draggedBedId = bed.id;
            dragStartRecorded = false;
            dragOffset.set(bed.x - groundIntersectPt.x, 0, bed.z - groundIntersectPt.z);
          }
          pulseStrength = 0.75;
          if (drawerOpen) syncDrawerFromSelected();
        } else {
          isOrbiting = true;
          isDraggingBed = false;
          draggedBedId = null;
        }
      });

      renderer.domElement.addEventListener("pointermove", (e) => {
        if (isDraggingBed && draggedBedId) {
          const bed = beds.find(b => b.id === draggedBedId);
          if (!bed) return;
          setPointerNDC(e.clientX, e.clientY);
          raycaster.setFromCamera(pointerNDC, camera);
          if (raycaster.ray.intersectPlane(groundHitPlane, groundIntersectPt)) {
            const movedDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            if (!dragStartRecorded && movedDist > 4) {
              recordHistory();
              dragStartRecorded = true;
            }
            const nx = Math.max(-34, Math.min(34, groundIntersectPt.x + dragOffset.x));
            const nz = Math.max(-34, Math.min(34, groundIntersectPt.z + dragOffset.z));
            bed.x = Math.round(nx * 2) / 2;
            bed.z = Math.round(nz * 2) / 2;
            const vis = bedVisuals.get(bed.id);
            if (vis) {
              vis.root.position.x = bed.x;
              vis.root.position.z = bed.z;
            }
          }
          return;
        }

        if (isOrbiting) {
          const dx = e.clientX - lastOrbitPos.x;
          const dy = e.clientY - lastOrbitPos.y;
          lastOrbitPos = { x: e.clientX, y: e.clientY };
          orbitYaw -= dx * 0.0075;
          orbitPitch += dy * 0.0065;
          updateCameraFromOrbit();
        }
      });

      renderer.domElement.addEventListener("pointerup", (e) => {
        const travel = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (isDraggingBed && draggedBedId && travel < 6) {
          const now = performance.now();
          const isDouble = lastTapInfo.bedId === draggedBedId && (now - lastTapInfo.time) <= 320;
          lastTapInfo = { bedId: draggedBedId, time: now };

          if (isDouble) {
            pulseStrength = 1.25;
            openDrawer(draggedBedId);
            showToast(`${draggedBedId} • Édition`);
          } else {
            pulseStrength = 0.85;
            const bed = beds.find(b => b.id === draggedBedId);
            if (bed) showToast(`${bed.code} • ${bed.name}`);
          }
        } else if (isDraggingBed && dragStartRecorded) {
          persistBeds();
        }

        isDraggingBed = false;
        isOrbiting = false;
        draggedBedId = null;
        dragStartRecorded = false;
      });

      renderer.domElement.addEventListener("wheel", (e) => {
        e.preventDefault();
        orbitDist += e.deltaY * 0.018;
        updateCameraFromOrbit();
      }, { passive: false });

      function csvEscape(val) {
        const str = String(val == null ? "" : val);
        if (/[",\r\n]/.test(str)) {
          return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
      }

      function parseRFC4180CSV(text) {
        const rows = [];
        let row = [];
        let cur = "";
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          const next = text[i + 1];

          if (inQuotes) {
            if (ch === '"' && next === '"') {
              cur += '"';
              i++;
            } else if (ch === '"') {
              inQuotes = false;
            } else {
              cur += ch;
            }
          } else {
            if (ch === '"') {
              inQuotes = true;
            } else if (ch === ",") {
              row.push(cur);
              cur = "";
            } else if (ch === "\r" && next === "\n") {
              row.push(cur);
              rows.push(row);
              row = [];
              cur = "";
              i++;
            } else if (ch === "\n" || ch === "\r") {
              row.push(cur);
              rows.push(row);
              row = [];
              cur = "";
            } else {
              cur += ch;
            }
          }
        }
        if (cur.length > 0 || row.length > 0) {
          row.push(cur);
          rows.push(row);
        }
        return rows.filter(r => r.some(cell => cell.trim() !== ""));
      }

      const CSV_HEADERS = ["code", "name", "w", "d", "x", "z", "rot", "mat", "veg", "status", "greenhouse", "net", "cells_json", "notes"];

      function exportCSV() {
        const lines = [CSV_HEADERS.join(",")];
        for (const b of beds) {
          lines.push([
            csvEscape(b.code),
            csvEscape(b.name),
            csvEscape(b.w),
            csvEscape(b.d),
            csvEscape(b.x),
            csvEscape(b.z),
            csvEscape(b.rot),
            csvEscape(b.mat),
            csvEscape(b.veg),
            csvEscape(b.status),
            csvEscape(b.greenhouse ? "1" : "0"),
            csvEscape(b.net ? "1" : "0"),
            csvEscape(JSON.stringify(b.cells)),
            csvEscape(b.notes || "")
          ].join(","));
        }
        return lines.join("\r\n");
      }

      function importCSVText(text) {
        const rows = parseRFC4180CSV(text);
        if (rows.length < 2) throw new Error("CSV vide ou incomplet");
        const header = rows[0].map(h => h.trim().toLowerCase());
        const idxOf = (k) => header.indexOf(k);
        const imported = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          let parsedCells = null;
          const cellsRaw = idxOf("cells_json") >= 0 ? r[idxOf("cells_json")] : "";
          if (cellsRaw) {
            try { parsedCells = JSON.parse(cellsRaw); } catch (e) { parsedCells = null; }
          }
          imported.push(normalizeBed({
            code: idxOf("code") >= 0 ? r[idxOf("code")] : undefined,
            name: idxOf("name") >= 0 ? r[idxOf("name")] : undefined,
            w: idxOf("w") >= 0 ? r[idxOf("w")] : 2,
            d: idxOf("d") >= 0 ? r[idxOf("d")] : 2,
            x: idxOf("x") >= 0 ? r[idxOf("x")] : 0,
            z: idxOf("z") >= 0 ? r[idxOf("z")] : 0,
            rot: idxOf("rot") >= 0 ? r[idxOf("rot")] : 0,
            mat: idxOf("mat") >= 0 ? r[idxOf("mat")] : "rust",
            veg: idxOf("veg") >= 0 ? r[idxOf("veg")] : "tomate",
            status: idxOf("status") >= 0 ? r[idxOf("status")] : "actif",
            greenhouse: idxOf("greenhouse") >= 0 ? ["1", "true", "oui", "yes"].includes(String(r[idxOf("greenhouse")]).toLowerCase()) : false,
            net: idxOf("net") >= 0 ? ["1", "true", "oui", "yes"].includes(String(r[idxOf("net")]).toLowerCase()) : false,
            cells: parsedCells,
            notes: idxOf("notes") >= 0 ? r[idxOf("notes")] : ""
          }, i - 1));
        }
        if (imported.length === 0) throw new Error("Aucun carré trouvé");
        return imported;
      }

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        pulseTime += dt * 7.5;
        if (pulseStrength > 0.005) {
          pulseStrength *= Math.pow(0.08, dt);
        } else {
          pulseStrength = 0;
        }

        for (const [id, vis] of bedVisuals.entries()) {
          const isSel = id === selectedId;
          const wave = 0.5 + 0.5 * Math.sin(pulseTime);
          if (isSel) {
            vis.highlightMat.opacity = Math.min(0.45, 0.12 + pulseStrength * 0.28 * wave);
          } else {
            vis.highlightMat.opacity = 0;
          }
        }

        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>

</html>
